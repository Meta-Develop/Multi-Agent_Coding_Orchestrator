[package]
name = "multi-agent-coding-orchestrator"
version = "0.3.0"
edition = "2021"
description = "Local-first multi-agent coding orchestrator"
license = "AGPL-3.0-or-later"
readme = "README.md"
documentation = "https://docs.rs/multi-agent-coding-orchestrator"
repository = "https://github.com/Meta-Develop/Multi-Agent_Coding_Orchestrator"
keywords = ["orchestration", "agents", "git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".agent/**",
    ".agents/**",
    ".maco/**",
    ".maco-cache/**",
    "AGENTS.md",
]
default-run = "maco"

[[bin]]
name = "multi-agent-coding-orchestrator"
path = "src/main.rs"

[[bin]]
name = "maco"
path = "src/bin/maco.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
git2 = { version = "0.20", default-features = false }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
