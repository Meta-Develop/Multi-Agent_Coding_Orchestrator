name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: Related requirement id
      description: If this maps to an FR-* or NFR-* in docs/SPEC.md, name it.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not ask the project to circumvent a vendor's rate limits, terms of service, or pricing.
          required: true
