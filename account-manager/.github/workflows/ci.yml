name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Front end (typecheck, lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          # libdbus-1-dev: the keyring crate links native libdbus for the
          # Secret Service backend. Today that package arrives only
          # transitively through libwebkit2gtk-4.1-dev; trimming this list
          # must not silently break the build.
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: package.json, Cargo.toml, and tauri.conf.json must agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          tauri_v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "package.json=$pkg cargo=$cargo_v tauri=$tauri_v"
          test "$pkg" = "$cargo_v" && test "$pkg" = "$tauri_v"

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No credential-shaped literals in tracked files
        run: |
          # Fixture values use the FAKE- prefix and must never embed a
          # vendor-shaped prefix. This regex is not exempted for FAKE-.
          # See docs/TESTING.md.
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|xai-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,})' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target . ; then
            echo "::error::credential-shaped literal found in tracked files"
            exit 1
          fi
          echo "no credential-shaped literals found"
