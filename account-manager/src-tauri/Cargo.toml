[workspace]
members = ["."]
resolver = "2"

[package]
name = "coding-agent-manager-desktop"
version = "0.1.0"
description = "Desktop shell for the Coding Agent Manager."
authors = ["Meta-Develop"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Meta-Develop/Coding-Agent-Manager"
edition = "2021"
rust-version = "1.89"

[lib]
# The `_lib` suffix keeps the desktop binary and the library target from
# colliding on Windows. See https://v2.tauri.app/
name = "coding_agent_manager_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "coding-agent-manager"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
coding_agent_manager_core = { package = "coding-agent-manager", path = "../core", version = "0.1.0", default-features = false }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
