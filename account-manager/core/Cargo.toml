[package]
name = "coding-agent-manager"
version = "0.1.0"
description = "Unified account, credential, and quota manager for AI coding agents."
authors = ["Meta-Develop"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Meta-Develop/Coding-Agent-Manager"
edition = "2021"
rust-version = "1.89"

[lib]
name = "coding_agent_manager_lib"
crate-type = ["rlib"]

[[bin]]
name = "account-authority"
path = "src/bin/account_authority.rs"

[[bin]]
name = "cam-grok-setup"
path = "src/bin/grok_setup.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# Keyring 4 exposes its API through keyring-core and explicit native stores.
keyring-core = "1.0.1"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
base64 = "0.22"
getrandom = "0.2"
subtle = "2"
sha2 = "0.10.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "stream"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["async-await", "std"] }
fs2 = "0.4"

# The synchronous store always opens a DH-encrypted Secret Service session.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
same-file = "1.0.6"

[dev-dependencies]
tempfile = "3"
