name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']
    paths-ignore:
      - maco-coordination.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  # Keep default-branch runs when a later commit starts; cancel only superseded pull_request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  repository-portability:
    name: Repository portability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository portability unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check tracked path portability
        run: python3 scripts/check_repository_portability.py

  linux-library:
    name: Linux library tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [autopilot, supervise, rest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Allow systemd-executor userns on GitHub-hosted Ubuntu
        run: bash .github/scripts/configure-github-hosted-userns.sh

      - name: Install Linux native build dependencies for headless CAM
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Verify delegated Linux process startup
        run: bash .github/scripts/run-linux-all-tests-in-delegated-user-scope.sh /usr/bin/true

      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Check formatting
        if: matrix.shard == 'rest'
        run: cargo fmt --all -- --check

      - name: Check all targets against Cargo.lock
        if: matrix.shard == 'rest'
        run: cargo check --locked --all-targets

      - name: Lint all targets
        if: matrix.shard == 'rest'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Install pinned Codex CLI on GitHub-hosted Ubuntu
        run: bash .github/scripts/install-github-hosted-ci-codex.sh

      - name: Verify nested Codex sandbox integration
        if: matrix.shard == 'rest'
        run: |
          bash .github/scripts/run-linux-all-tests-in-delegated-user-scope.sh \
            cargo test --locked --lib \
            'process_runner::tests::nested_codex_profile_appends_exact_journal_while_outer_keeps_parent_nonwritable' \
            -- --exact --nocapture

      - name: Run library tests
        run: bash .github/scripts/run-linux-ci-cargo-test-partition.sh lib "${{ matrix.shard }}"

  linux-integration:
    name: Linux integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Allow systemd-executor userns on GitHub-hosted Ubuntu
        run: bash .github/scripts/configure-github-hosted-userns.sh

      - name: Install Linux native build dependencies for headless CAM
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Verify delegated Linux process startup
        run: bash .github/scripts/run-linux-all-tests-in-delegated-user-scope.sh /usr/bin/true

      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Install pinned Codex CLI on GitHub-hosted Ubuntu
        run: bash .github/scripts/install-github-hosted-ci-codex.sh

      - name: Run integration and binary tests
        run: bash .github/scripts/run-linux-ci-cargo-test-partition.sh non-lib

  linux-gate:
    name: Linux fmt, check, clippy, and test
    runs-on: ubuntu-latest
    needs:
      - linux-library
      - linux-integration
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require partitioned Linux test jobs
        # A matrix job succeeds only when every shard succeeds. Cancelled,
        # failed, or skipped shards must not satisfy this required gate.
        env:
          LIBRARY_RESULT: ${{ needs.linux-library.result }}
          INTEGRATION_RESULT: ${{ needs.linux-integration.result }}
        run: |
          if [[ "${LIBRARY_RESULT}" != "success" || "${INTEGRATION_RESULT}" != "success" ]]; then
            echo "linux-library result: ${LIBRARY_RESULT}"
            echo "linux-integration result: ${INTEGRATION_RESULT}"
            exit 1
          fi

  portable-build:
    name: ${{ matrix.os }} compile and test build
    needs: repository-portability
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Check all targets against Cargo.lock
        run: cargo check --locked --all-targets

      - name: Lint all targets on Windows
        if: matrix.os == 'windows-latest'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Compile all tests without running them
        run: cargo test --locked --all-targets --no-run

      - name: Run Windows windowless Job lifecycle regressions
        if: matrix.os == 'windows-latest'
        run: 'cargo test --locked --lib process_runner::windows_tests:: -- --nocapture --test-threads=1'

      - name: Run four common inbox tests on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $sourcePath = 'src/inbox/review_repair_flow_tests.rs'
          $source = [IO.File]::ReadAllText((Join-Path $PWD $sourcePath)).Replace("`r`n", "`n")
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $sourceHash = [BitConverter]::ToString($sha256.ComputeHash([Text.Encoding]::UTF8.GetBytes($source))).Replace('-', '').ToLowerInvariant()
          } finally {
            $sha256.Dispose()
          }
          if ($sourceHash -cne 'a19f299befe51ac01d55e94e708e408a0ff125102cad0798d4cc5fb423d2b775') {
            throw 'Common inbox test source changed; fresh caller and skip-boundary review is required.'
          }
          $tests = @(
            'inbox::review_repair_flow::review_repair_flow_tests::validation_bundle_refuses_empty_or_incomplete_reports_and_retains_all_passed'
            'inbox::review_repair_flow::review_repair_flow_tests::repair_producer_fingerprint_matches_authenticated_execution_record'
            'inbox::review_repair_flow::review_repair_flow_tests::pending_admission_journal_append_is_idempotent_for_same_digest'
            'inbox::review_repair_flow::review_repair_flow_tests::resume_replays_completed_transition_without_second_update'
          )
          $completed = 0
          foreach ($testName in $tests) {
            $output = @(& cargo test --locked --lib $testName -- --exact --nocapture --test-threads=1 2>&1)
            $cargoExit = $LASTEXITCODE
            $output | ForEach-Object { Write-Host "$_" }
            Write-Host "COMMON_INBOX_CARGO_EXIT=$cargoExit FILTER=$testName"
            if ($cargoExit -ne 0) {
              exit $cargoExit
            }
            $lines = @($output | ForEach-Object { "$_" -replace '\x1B\[[0-?]*[ -/]*[@-~]', '' })
            $namePattern = '^test ' + [regex]::Escape($testName) + ' \.\.\. ok$'
            $summaryPattern = '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+$'
            if (@($lines | Where-Object { $_ -cmatch '^running 1 test$' }).Count -ne 1 -or
                @($lines | Where-Object { $_ -cmatch $namePattern }).Count -ne 1 -or
                @($lines | Where-Object { $_ -cmatch $summaryPattern }).Count -ne 1) {
              throw "Expected exactly one executed and passed, nonignored named test: $testName"
            }
            $completed++
            Write-Host "COMMON_INBOX_ACCEPTED=$testName EXECUTED=1 PASSED=1 IGNORED=0"
          }
          if ($completed -ne 4) {
            throw "Expected four accepted common inbox tests; received $completed."
          }

      - name: Run common snapshot protocol golden on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $testName = 'review::tests::snapshot_tree_entry_serialization_and_canonical_vectors_preserve_complete_schema'
          $output = @(& cargo test --locked --lib $testName -- --exact --nocapture --test-threads=1 2>&1)
          $cargoExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host "$_" }
          Write-Host "COMMON_SNAPSHOT_CARGO_EXIT=$cargoExit FILTER=$testName"
          if ($cargoExit -ne 0) {
            exit $cargoExit
          }
          $lines = @($output | ForEach-Object { "$_" -replace '\x1B\[[0-?]*[ -/]*[@-~]', '' })
          $namePattern = '^test ' + [regex]::Escape($testName) + ' \.\.\. ok$'
          $summaryPattern = '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+$'
          $running = @($lines | Where-Object { $_ -cmatch '^running [0-9]+ tests?$' })
          $named = @($lines | Where-Object { $_ -cmatch '^test (?!result:)' })
          $summaries = @($lines | Where-Object { $_ -cmatch '^test result:' })
          if ($running.Count -ne 1 -or $running[0] -cne 'running 1 test' -or
              $named.Count -ne 1 -or $named[0] -cnotmatch $namePattern -or
              $summaries.Count -ne 1 -or $summaries[0] -cnotmatch $summaryPattern -or
              @($lines | Where-Object { $_ -match '\bskip(?:ped)?\b' }).Count -ne 0) {
            throw "Expected exactly one executed and passed, nonignored snapshot protocol test: $testName"
          }
          Write-Host "COMMON_SNAPSHOT_ACCEPTED=$testName EXECUTED=1 PASSED=1 IGNORED=0"

  required-rust-gate:
    name: Required Rust CI gate
    runs-on: ubuntu-latest
    needs:
      - repository-portability
      - linux-gate
      - portable-build
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require portability, Linux tests, and portable builds
        env:
          PORTABILITY_RESULT: ${{ needs.repository-portability.result }}
          LINUX_RESULT: ${{ needs.linux-gate.result }}
          PORTABLE_RESULT: ${{ needs.portable-build.result }}
        run: |
          if [[ "${PORTABILITY_RESULT}" != "success" || "${LINUX_RESULT}" != "success" || "${PORTABLE_RESULT}" != "success" ]]; then
            echo "repository-portability result: ${PORTABILITY_RESULT}"
            echo "linux-gate result: ${LINUX_RESULT}"
            echo "portable-build result: ${PORTABLE_RESULT}"
            exit 1
          fi
