name: Rust CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  repository-portability:
    name: Repository portability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run repository portability unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check tracked path portability
        run: python3 scripts/check_repository_portability.py

  linux:
    name: Linux fmt, check, clippy, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets against Cargo.lock
        run: cargo check --locked --all-targets

      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run all tests
        shell: bash
        run: |
          current_cgroup="$(awk -F: '$1 == "0" && $2 == "" { print $3; exit }' /proc/self/cgroup)"
          delegated_user_manager=false
          while IFS= read -r component; do
            if [[ "$component" == user@*.service ]]; then
              delegated_user_manager=true
              break
            fi
          done < <(tr '/' '\n' <<< "$current_cgroup")

          test_harness_args=()
          if [[ "$delegated_user_manager" == false ]]; then
            reason="current cgroup ${current_cgroup:-<unified cgroup v2 entry absent>} is not inside a delegated systemd user manager"
            test_harness_args+=(--exact --show-output)
            while IFS= read -r test_name; do
              [[ -z "$test_name" ]] && continue
              printf 'SKIP %s: %s\n' "$test_name" "$reason"
              printf '::notice title=Containment test skipped::%s: %s\n' "$test_name" "$reason"
              test_harness_args+=(--skip "$test_name")
            done <<'CONTAINMENT_DEPENDENT_TESTS'
          agent::tests::allowed_provider_command_timeout_with_keep_claims_leaves_claim_active
          agent::tests::fake_provider_agent_run_edits_only_agent_worktree_and_releases_claim
          agent::tests::fake_provider_agent_run_reports_unclaimed_changes
          agent::tests::fake_provider_patch_with_mismatched_diff_path_is_rejected_before_apply
          agent::tests::provider_commands_are_disabled_by_default_and_not_executed
          autopilot::tests::autopilot_authenticated_follow_up_dispatch_sets_boolean_after_real_gates
          autopilot::tests::autopilot_cancellation_after_source_gate_refuses_dispatch_and_finalizes_cancelled
          autopilot::tests::autopilot_cascade_error_after_authenticated_follow_up_start_never_reports_false
          autopilot::tests::autopilot_generated_plan_refusal_keeps_dispatch_boolean_false
          autopilot::tests::autopilot_marker_without_child_checkpoint_refuses_a_false_final_report
