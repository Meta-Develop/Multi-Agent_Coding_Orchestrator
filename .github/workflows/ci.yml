name: Rust CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  repository-portability:
    name: Repository portability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository portability unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check tracked path portability
        run: python3 scripts/check_repository_portability.py

  linux:
    name: Linux fmt, check, clippy, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets against Cargo.lock
        run: cargo check --locked --all-targets

      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run all tests
        shell: bash
        run: |
          # No name skip list: containment-dependent lib tests execute
          # inside the delegated user manager, or the helper fails closed.
          python3 scripts/run_in_delegated_user_manager.py -- \
            cargo test --locked --all-targets

  portable-build:
    name: ${{ matrix.os }} compile and test build
    needs: repository-portability
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Check all targets against Cargo.lock
        run: cargo check --locked --all-targets

      - name: Compile all tests without running them
        run: cargo test --locked --all-targets --no-run

      - name: Record compile-only coverage
        shell: bash
        run: |
          {
            echo "This ${{ matrix.os }} job compiles the test suite (--no-run) and does not execute it."
            echo "Linux containment-dependent tests run in the linux job inside a delegated systemd user manager."
          } >> "${GITHUB_STEP_SUMMARY}"
