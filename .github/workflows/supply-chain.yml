name: Supply-chain policy

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Cargo.lock, RustSec, licenses, bans, and sources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Verify Cargo.lock is current
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Verify the locked release package
        run: cargo package --locked

      - name: Install pinned supply-chain tools
        run: |
          eval "$(
            python3 - <<'PY'
          import pathlib
          import tomllib

          pins = tomllib.loads(
              pathlib.Path("scripts/supply_chain_pins.toml").read_text(encoding="utf-8")
          )
          for name in ("cargo_audit", "cargo_deny"):
              value = pins.get(name)
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"scripts/supply_chain_pins.toml missing {name}")
              print(f"{name.upper()}={value}")
          PY
          )"
          cargo install --locked --version "${CARGO_AUDIT}" cargo-audit
          cargo install --locked --version "${CARGO_DENY}" cargo-deny
          installed_audit="$(cargo audit --version | awk '{ print $2; exit }')"
          installed_deny="$(cargo deny --version | awk '{ print $2; exit }')"
          if [[ "${installed_audit}" != "${CARGO_AUDIT}" ]]; then
            echo "expected cargo-audit ${CARGO_AUDIT}, got ${installed_audit}" >&2
            exit 1
          fi
          if [[ "${installed_deny}" != "${CARGO_DENY}" ]]; then
            echo "expected cargo-deny ${CARGO_DENY}, got ${installed_deny}" >&2
            exit 1
          fi
          cargo audit --version
          cargo deny --version

      - name: Check RustSec advisories
        run: cargo audit --deny warnings

      - name: Enforce dependency policy
        run: cargo deny --locked check -D warnings advisories bans licenses sources
