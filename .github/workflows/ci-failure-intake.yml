name: Public Repository CI Failure Intake

"on":
  workflow_run:
    workflows:
      - "Rust CI"
      - "Supply-chain policy"
      - "Minimum supported Rust version"
      - "Account Manager CI"
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: >-
    public-ci-failure-${{ github.event.workflow_run.workflow_id }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile the CI failure issue
    if: >-
      ${{
        github.event.workflow_run.head_repository.full_name ==
        github.repository
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out intake script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconcile failure and recovery state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require("node:path");
            const { reconcileCiFailureIntake } = require(
              path.join(
                process.env.GITHUB_WORKSPACE,
                ".github/scripts/ci-failure-intake.js",
              ),
            );
            await reconcileCiFailureIntake({ github, context, core });
