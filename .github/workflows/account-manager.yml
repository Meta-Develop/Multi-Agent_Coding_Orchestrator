name: Account Manager CI

on:
  pull_request:
  push:
    paths-ignore:
      - maco-coordination.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-manager-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  DESKTOP_MANIFEST: account-manager/src-tauri/Cargo.toml

defaults:
  run:
    working-directory: account-manager

jobs:
  desktop-lock:
    name: Desktop lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect shared-core lockfile drift
        run: python3 scripts/check_desktop_lockfile.py --parse-only
      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install
          rustc --version --verbose
          cargo --version --verbose
      - name: Verify consuming lockfiles with --locked
        run: python3 scripts/check_desktop_lockfile.py --cargo-only

  frontend:
    name: Account manager frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: account-manager/.nvmrc
          cache: npm
          cache-dependency-path: account-manager/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Check application versions agree
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, tomllib
          package = json.loads(pathlib.Path('package.json').read_text())['version']
          native = tomllib.loads(pathlib.Path('src-tauri/Cargo.toml').read_text())['package']['version']
          desktop = json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())['version']
          assert package == native == desktop, (package, native, desktop)
          PY

  rust:
    name: Account manager ${{ matrix.mode }} (${{ matrix.os }})
    needs: desktop-lock
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [desktop, headless]
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux native prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Install Linux desktop prerequisites
        if: matrix.os == 'ubuntu-latest' && matrix.mode == 'desktop'
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libsecret-1-dev patchelf
      - name: Install pinned application toolchain
        run: |
          rustup toolchain install
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version
      - name: Refuse desktop dependencies in native core
        if: matrix.mode == 'headless'
        run: |
          cargo tree --locked -p coding-agent-manager --no-default-features \
            --edges normal,build,dev --prefix none --format '{p}' > headless-dependencies.txt
          python3 - <<'PY'
          from pathlib import Path
          names = {line.split()[0] for line in Path('headless-dependencies.txt').read_text().splitlines()}
          forbidden = sorted(name for name in names if name == 'tauri' or name.startswith(('tauri-', 'gtk', 'webkit')))
          assert not forbidden, forbidden
          PY
      - name: Format headless core
        if: matrix.mode == 'headless'
        run: cargo fmt -p coding-agent-manager -- --check
      - name: Check headless core
        if: matrix.mode == 'headless'
        run: cargo check --locked -p coding-agent-manager --no-default-features --all-targets
      - name: Clippy headless core
        if: matrix.mode == 'headless'
        run: cargo clippy --locked -p coding-agent-manager --no-default-features --all-targets -- -D warnings
      - name: Test headless core
        if: matrix.mode == 'headless'
        run: cargo test --locked -p coding-agent-manager --no-default-features
      - name: Test headless core (desktop matrix)
        if: matrix.mode == 'desktop'
        run: cargo test --locked -p coding-agent-manager --no-default-features
      - name: Format desktop shell
        if: matrix.mode == 'desktop'
        run: cargo fmt --manifest-path "${DESKTOP_MANIFEST}" --all -- --check
      - name: Check desktop shell
        if: matrix.mode == 'desktop'
        run: cargo check --locked --manifest-path "${DESKTOP_MANIFEST}" --all-targets
      - name: Clippy desktop shell
        if: matrix.mode == 'desktop'
        run: cargo clippy --locked --manifest-path "${DESKTOP_MANIFEST}" --all-targets -- -D warnings
      - name: Test desktop shell
        if: matrix.mode == 'desktop'
        run: cargo test --locked --manifest-path "${DESKTOP_MANIFEST}" -p coding-agent-manager-desktop

  required-account-manager-gate:
    name: Required account manager CI gate
    runs-on: ubuntu-latest
    needs:
      - desktop-lock
      - frontend
      - rust
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require lockfile, frontend, and all core and desktop matrix jobs
        env:
          LOCK_RESULT: ${{ needs.desktop-lock.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          if [[ "${LOCK_RESULT}" != "success" || "${FRONTEND_RESULT}" != "success" || "${RUST_RESULT}" != "success" ]]; then
            echo "desktop-lock result: ${LOCK_RESULT}"
            echo "frontend result: ${FRONTEND_RESULT}"
            echo "account-manager rust matrix result: ${RUST_RESULT}"
            exit 1
          fi
